# true-cyber — product CLI. cargo install true-cyber → binary `cyber`
[package]
name = "true-cyber"
version = "0.5.1"
edition = "2021"
description = "cyber — thin product CLI for spacepussy-test (soft3 chaosnet on cybernode)"
license-file = "LICENSE"
repository = "https://github.com/cyberia-to/true-cyber"
homepage = "https://cyber.page"
readme = "README.md"
keywords = ["cyber", "soft3", "spacepussy-test", "cli"]
categories = ["command-line-utilities"]
rust-version = "1.74"

[[bin]]
name = "cyber"
path = "src/main.rs"

[dependencies]
ureq = { version = "2", default-features = false, features = ["tls"] }
serde_json = "1"
