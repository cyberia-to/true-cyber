# ---
# tags: cyber, cli, config
# crystal-type: source
# crystal-domain: cyber
# ---
# true-cyber — product CLI. cargo install true-cyber → binary `cyber`
[package]
name = "true-cyber"
version = "0.8.0"
edition = "2021"
description = "cyber — the phase-1 root chain client: transfer, cyberlink, claim over soft3"
license-file = "LICENSE"
repository = "https://github.com/cyberia-to/true-cyber"
homepage = "https://cyber.page"
readme = "README.md"
keywords = ["cyber", "soft3", "chain", "wallet", "cli"]
categories = ["command-line-utilities"]
rust-version = "1.95"

[[bin]]
name = "cyber"
path = "src/main.rs"

[dependencies]
# The chain client is soft3::wallet; this binary is the command line around it.
soft3 = { version = "0.10", path = "../soft3/crate" }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
hemera = { package = "cyber-hemera", version = "0.3", path = "../hemera/rs" }
