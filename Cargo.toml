# ---
# tags: cyber, cli, config
# crystal-type: source
# crystal-domain: cyber
# ---
# true-cyber — product CLI. cargo install true-cyber → binary `cyber`
[package]
name = "true-cyber"
version = "0.7.0"
edition = "2021"
description = "cyber — authenticated native graph client with durable neuron custody and history"
license-file = "LICENSE"
repository = "https://github.com/cyberia-to/true-cyber"
homepage = "https://cyber.page"
readme = "README.md"
keywords = ["cyber", "soft3", "spacepussy-test", "cli"]
categories = ["command-line-utilities"]
rust-version = "1.95"

[[bin]]
name = "cyber"
path = "src/main.rs"

[dependencies]
# Common product composition; no parallel custody or execution implementation.
cyb-core = { path = "../cyb/core" }
cybergraph = { version = "0.1.1", path = "../cybergraph", features = ["local-storage"] }
foculus = { version = "0.1.3", path = "../foculus", default-features = false }
hemera = { package = "cyber-hemera", version = "0.3", path = "../hemera/rs" }
# the last borrowed transport — radio replaces it
ureq = { version = "2", default-features = false, features = ["tls"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
soft3 = { path = "../soft3/crate" }
